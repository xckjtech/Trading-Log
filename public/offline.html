<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d0c" />
    <title>Trading Log</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #090d0c; color: #f4f7f5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, rgba(57,230,164,.12), transparent 26rem), #090d0c; text-align: center; }
      main { max-width: 320px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 17px 6px 17px 6px; background: #d6ff46; color: #0d120e; display: grid; place-items: center; font: 800 33px/1 monospace; }
      h1 { margin: 0 0 10px; font-size: 23px; }
      p { margin: 0; color: #8c9893; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body><main><div class="mark">H</div><h1>Trading Log</h1><p>当前没有网络连接。恢复网络后即可继续查看和记录交易。</p></main></body>
</html>
